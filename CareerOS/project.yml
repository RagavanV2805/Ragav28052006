# CareerOS — XcodeGen project specification.
# Generate the Xcode project with:  xcodegen generate
# (XcodeGen keeps the .xcodeproj out of source control; every target,
# file and setting is described declaratively below.)

name: CareerOS
options:
  bundleIdPrefix: com.careeros
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  # MARK: - Application
  CareerOS:
    type: application
    platform: iOS
    sources:
      - CareerOS
      - Shared
    resources:
      - CareerOS/Assets.xcassets
    entitlements:
      path: CareerOS/CareerOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.careeros.shared
    info:
      path: CareerOS/Info.plist
      properties:
        CFBundleDisplayName: CareerOS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.careeros.app
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: CareerOSWidgets
    preBuildScripts: []

  # MARK: - Widgets
  CareerOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - CareerOSWidgets
      - Shared
    entitlements:
      path: CareerOSWidgets/CareerOSWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.careeros.shared
    info:
      path: CareerOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: CareerOS Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.careeros.app.widgets
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true

  # MARK: - Unit tests
  CareerOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CareerOSTests
    dependencies:
      - target: CareerOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.careeros.app.tests
        GENERATE_INFOPLIST_FILE: true

  # MARK: - UI tests
  CareerOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CareerOSUITests
    dependencies:
      - target: CareerOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.careeros.app.uitests
        TEST_TARGET_NAME: CareerOS
        GENERATE_INFOPLIST_FILE: true

schemes:
  CareerOS:
    build:
      targets:
        CareerOS: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CareerOSTests
        - CareerOSUITests
    profile:
      config: Release
    analyze:
      config: Debug
